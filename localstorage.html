<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Local Storage</title>
</head>
<body>

    <main>
        <h1>Local Storage: Save, Get, and Delete Data.</h1>

        <form>
        
        
            <div class="input-group mb-3">
                <label class="input-group-text">Username</label>
                <input id="username" class="form-control" type="text" placeholder="fer123">
            </div>

            <div class="input-group mb-3">
                <label class="input-group-text">Name</label>
                <input id="name" class="form-control" type="text" placeholder="Fernanda">
            </div>

            <div class="input-group mb-3">
                <label class="input-group-text">Age</label>
                <input id="age" class="form-control" type="number" placeholder="30">
            </div>

            <div class="input-group mb-3">
                <label class="input-group-text">Email</label>
                <input id="email" class="form-control" type="email" placeholder="fernandamurillo@SDGKU.com">
            </div>

            
            <div class="d-flex gap-4 justify-content-end">
                <button id="saveBtn" class="btn btn-primary" type="button">Save</button>
                <button id="getBtn" class="btn btn-secondary" type="button">Get</button>
                <button id="deleteBtn" class="btn btn-danger" type="button">Delete</button>
            </div>

        </form>

        <div class="container mt-5 bg-light p-2">
            <h2>Saved Data</h2>

            <p id="result"></p>
        </div>
           

       
















 <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>   
 <script src="./scripts/localstorage.js"></script>
</body>
</html>

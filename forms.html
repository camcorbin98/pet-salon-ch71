<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Forms</title>
</head>
<body class="m-5">
    <h1>Product Registration</h1>

    <form class="bg-light p-4 m-3 border rounded">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input id="form-control" type="text" placeholder="Apples">
        </div>

        <div class="mb-3">
            <label class="form-label">Price</label>
            <input id="form-control" type="number" placeholder="10.99">
        </div>
        
        <div class="mb-3">
            <label class="form-label">Category</label>
            <select id="productCategory" class="form-select">
                <option value="">Select a category</option>
                <option value="fruits">Fruits</option>
                <option value="electronics">Electronics</option>
            </select>
        </div>

        <div class="d-flex justify-content-end gap-3">
            <button onclick="registerProduct(event)" class="btn btn-primary" type="submit">Register</button>
            <button class="btn btn-secondary" type="reset">Reset</button>
        </div>

    </form>

    <div id="productList" class="d-flex gap-3 flex-wrap m-3">


    </div>

    <script src="./scripts/forms.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles/registration.css">
    <title>Registration</title>
</head>
<body>


  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      
      <a class="navbar-brand" href="index.html">Pet Salon</a>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="index.html">Home</a>
          </li>
          
          <li class="nav-item">
            <a class="nav-link" href="services.html">Services</a>
          </li>
          
          <li class="nav-item">
            <a class="nav-link" href="registration.html">Registration</a>
          </li>
        
        
        </ul>
      
      
      </div>
    
    
    </div>
  
  </nav>
  
  
  
  <section class="registration-section">
    <h1>Registration</h1>

    <h2>Registered Pets</h2>
    
    
    <div id="petList"></div>
  
  </section>
  <section>
    
    <h1>Registration</h1>
    
    <form class="bg-light p-4 m-3 border rounded">
        
      <div class="mb-3">
          <label for="petName" class="form-label">Name</label>
          <input type="text" class="form-control" id="petName" placeholder="Dobby">
        </div>

        <div class="mb-3">
            <label for="petAge" class="form-label">Age</label>
            <input type="number" class="form-control" id="petAge" placeholder="7">
        </div>

        <div class="mb-3">
            <label for="petBreed" class="form-label">Breed</label>
            <input type="text" class="form-control" id="petBreed" placeholder="Terrier">
        </div>

        <div class="mb-3">
            <label for="petGender" class="form-label">Gender</label>
            <input type="text" class="form-control" id="petGender" placeholder="Email" aria-label="email" aria-describedy="basic-addon4">
        </div>

        <div class="mb-3">
            <label for="petService" class="form-label">Service</label>
            <select class="form-select" id="petService">
              <option value="">Select a service</option>
              <option value="Wash">Wash</option>
              <option value="Hair Cut">Hair Cut</option>
              <option value="Nail Clipping">Nail Clipping</option>
              <option value="Complete Experience">Complete Experience</option>
            </select>
        
        </div>

        <div class="d-flex justify-content-end gap-3">
          <button onclick="registerPet(event)" class="btn btn-primary" type="submit">
            Register 
          </button>

          <button class="btn btn-secondary" type="reset">
            Reset
          </button>
        </div>
        
    </form>
  </section>
  <section>
    <h2>Registered Pets</h2>
    <table class="table table-striped table-bordered">
        <!----Header-->
      <tr>
          <th>Name</th>
          <th>Age</th>
          <th>Gender</th>
          <th>Email</th>
          <th>Class</th>
      </tr>
        <!--Body-->
      <tbody id="petTableBody">
      </tbody>
    </table>
  </section>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  
  <script src="./scripts/registration.js"></script>

</body>
</html>

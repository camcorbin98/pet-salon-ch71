<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Student Registration</title>
</head>
<body class="m-5">
    <h1>Student Registration</h1>
    <form class="bg-light p-4 m-3 border rounded">
        <div class="input-group mb-3">
            <span class="input-group-text" id="name">Name</span>
            <input type="text" class="form-control" placeholder="Name" aria-label="Name" aria-describedby="basic-addon1">
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text" id="lastame">Last Name</span>
            <input type="text" class="form-control" placeholder="Last Name" aria-label="Last Name" aria-describedby="basic-addon2">
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text" id="cohort">Cohort</span>
            <input type="number" class="form-control" placeholder="71" aria-label="cohort" aria-describedby="basic-addon3">
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text" id="email">Email</span>
            <input type="email" class="form-control" placeholder="Email" aria-label="email" aria-describedy="basic-addon4">
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text" id="class">Class</span>
            <input type="number" class="form-control" placeholder="104" aria-label="class" aria-describedy="basic-addon5">
        </div>

        <div class="d-flex justify-content-end gap-3">
            <button onclick="registerStudent(event)" class="btn btn-primary" type="submit">Register</button>
            <button class="btn btn-secondary" type="reset">Reset</button>
        </div>
    </form>

    <h2>Students List</h2>
    <table class="table p-4 m-4">
        <!----Header-->
        <tr>
            <th>Name</th>
            <th>Lastname</th>
            <th>Cohort</th>
            <th>Email</th>
            <th>Class</th>
        </tr>
        <!--Body-->
        <tbody>
            
        </tbody>
    </table>
    
</body>
</html>
